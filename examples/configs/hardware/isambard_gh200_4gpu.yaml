# Isambard-AI Phase 2 — NVIDIA GH200 (Hopper H100), one node (4 GPUs). SysSim hardware-YAML schema.
# Intra-node NVLink mesh (point-to-point, no NVSwitch); inter-node Slingshot not exercised here.

peak_tflops_mm: 1979              # H100 bf16/fp16 tensor-core peak (TFLOP/s)
peak_tflops_math: 989             # H100 vector/math peak
peak_memory_bandwidth_GBps: 3350  # H100 HBM3
peak_tflops_mm_fp8: 3958

gpus_per_node: 4
gpu_memory_GB: 96                 # 96 GB HBM3 per GPU (384 GB/node)

# Use the GH200-calibrated per-op compute model (TreeEstimator); compute peaks above match the
# anchor it was calibrated against.
calibrated_model: data/gh200

# Topology: intra-node NVLink mesh (fully_connected), 4 GPUs/node.
topology:
  dims:      [ fully_connected ]
  size:      [ 4 ]
  bandwidth: [ 450 ]               # GB/s, per-GPU NVLink (uni-directional)
  latency:   [ 12000 ]             # ns per ring hop
