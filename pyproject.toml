[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syssim"
version = "0.1.0"
description = "PyTorch operator-level performance simulator using roofline models and ML-based efficiency prediction"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "SysSim Contributors" },
]
keywords = ["pytorch", "performance", "simulation", "roofline", "neural-network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
profiler = [
    "scikit-learn",
    "xgboost",
]
# FP8/FP4 GEMM + attention kernels (Blackwell). CUDA-only wheel; install separately.
profiler-lowp = [
    "syssim[profiler]",
    "flashinfer-python>=0.6",
]
huggingface = [
    "transformers",
]
diffusers = [
    "diffusers",
    "transformers",
]
megatron = [
    "megatron-core",
]
# PLENA accelerator backend. Requires the PLENA_Simulator git submodule
# to be initialized (`git submodule update --init --recursive`).
plena = []
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
all = [
    "syssim[profiler,huggingface,diffusers,megatron,plena,dev]",
]

[project.urls]
Homepage = "https://github.com/AISysSim/SysSim"
Repository = "https://github.com/AISysSim/SysSim"
Issues = "https://github.com/AISysSim/SysSim/issues"

[tool.setuptools.packages.find]
include = ["syssim*"]

[tool.setuptools.package-data]
syssim = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports are intentional (public API surface)
"__init__.py" = ["F401"]
# Standalone scripts may need late imports after sys.path manipulation
"syssim/compute/validate_profiler.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: marks tests that require CUDA (deselect with '-m \"not cuda\"')",
    "plena: marks tests that require the PLENA_Simulator submodule (deselect with '-m \"not plena\"')",
]
