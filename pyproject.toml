[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syssim"
version = "0.1.0"
description = "PyTorch operator-level performance simulator using roofline models and ML-based efficiency prediction"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "SysSim Contributors" },
]
keywords = ["pytorch", "performance", "simulation", "roofline", "neural-network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
profiler = [
    "scikit-learn",
    "xgboost",
]
huggingface = [
    "transformers",
]
diffusers = [
    "diffusers",
    "transformers",
]
megatron = [
    "megatron-core",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
all = [
    "syssim[profiler,huggingface,diffusers,megatron,dev]",
]

[project.urls]
Homepage = "https://github.com/AISysSim/SysSim"
Repository = "https://github.com/AISysSim/SysSim"
Issues = "https://github.com/AISysSim/SysSim/issues"

[tool.setuptools.packages.find]
include = ["syssim*"]

[tool.setuptools.package-data]
syssim = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: marks tests that require CUDA (deselect with '-m \"not cuda\"')",
]
